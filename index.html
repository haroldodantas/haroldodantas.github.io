<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #d1d5db;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111827;
      --card-bg: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111827;
    --card-bg: #1f2937;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --border: #374151;
    --primary: #3b82f6;
    --primary-hover: #60a5fa;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 360px;
  }

  h1 {
    font-size: 1.4rem;
    margin: 0 0 24px;
    text-align: center;
  }

  label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 6px;
    color: var(--muted);
  }

  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    background: transparent;
    color: var(--text);
  }

  input:focus {
    outline: none;
    border-color: var(--primary);
  }

  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover {
    background: var(--primary-hover);
  }

  .msg {
    text-align: center;
    font-size: 0.85rem;
    margin-top: 14px;
    color: var(--muted);
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Entrar</h1>
    <form id="loginForm">
      <label for="user">Usuário</label>
      <input type="text" id="user" name="user" autocomplete="username" required>

      <label for="pass">Senha</label>
      <input type="password" id="pass" name="pass" autocomplete="current-password" required>

      <button type="submit">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var user = document.getElementById('user').value.trim();
      document.getElementById('msg').textContent = user
        ? 'Formulário enviado (exemplo estático — sem backend).'
        : 'Preencha usuário e senha.';
    });
  </script>
</body>
</html>
