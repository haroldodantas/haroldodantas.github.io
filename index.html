<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HDM - Login</title>
  <style>
    :root {
      --bg-1: #eaf5e8;
      --bg-2: #bfdcc0;
      --bg-3: #7ca97a;
      --card-bg: rgba(255, 255, 255, 0.78);
      --text: #0f172a;
      --muted: #475569;
      --border: rgba(35, 64, 43, 0.15);
      --primary: #1d4ed8;
      --primary-strong: #163bb5;
      --secondary: #e2e8f0;
      --shadow: rgba(15, 23, 42, 0.16);
      --success: #15803d;
      --warning: #b45309;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 35%, var(--bg-3) 100%);
      color: var(--text);
      overflow: hidden;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.6) 0, rgba(255,255,255,0) 18%),
        radial-gradient(circle at 70% 10%, rgba(255,255,255,0.45) 0, rgba(255,255,255,0) 20%),
        linear-gradient(to top, rgba(10, 36, 20, 0.35), rgba(10, 36, 20, 0));
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 35vh;
      background:
        linear-gradient(to top, rgba(10, 31, 18, 0.88), rgba(10, 31, 18, 0.12)),
        repeating-linear-gradient(
          90deg,
          rgba(22, 70, 38, 0.8) 0 30px,
          rgba(18, 58, 33, 0.88) 30px 60px,
          rgba(15, 47, 30, 0.9) 60px 90px
        );
      clip-path: polygon(0 100%, 0 42%, 8% 50%, 14% 35%, 22% 52%, 30% 30%, 36% 55%, 43% 38%, 50% 48%, 58% 28%, 66% 52%, 74% 36%, 82% 58%, 90% 32%, 100% 52%, 100% 100%);
      z-index: 0;
      pointer-events: none;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: min(100%, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 12px 25px rgba(13, 51, 26, 0.12);
      backdrop-filter: blur(8px);
    }

    .brand-mark {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      display: block;
      box-shadow: 0 10px 20px rgba(29, 78, 216, 0.2);
      background: linear-gradient(135deg, #1d4ed8, #60a5fa);
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .brand-name {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #0f172a;
    }

    .brand-subtitle {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 22px 22px;
      box-shadow: 0 20px 40px var(--shadow);
      backdrop-filter: blur(6px);
    }

    h1 {
      margin: 0 0 18px;
      font-size: 1.7rem;
      text-align: center;
      color: var(--text);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.7);
      font-size: 1rem;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: rgba(29, 78, 216, 0.7);
      box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.12);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white;
      box-shadow: 0 12px 20px rgba(29, 78, 216, 0.2);
    }

    .secondary-btn {
      background: var(--secondary);
      color: var(--text);
    }

    .hidden {
      display: none;
    }

    .msg {
      min-height: 20px;
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .success {
      color: var(--success);
      font-weight: 600;
    }

    .warning {
      color: var(--warning);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="brand" aria-label="Logo da HDM">
      <svg class="brand-mark" viewBox="0 0 120 120" role="img" aria-label="Logo HDM">
        <defs>
          <linearGradient id="hdmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1d4ed8" />
            <stop offset="100%" stop-color="#60a5fa" />
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="120" height="120" rx="32" fill="url(#hdmGradient)" />
        <path d="M28 82 L58 30 L88 82" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M40 70 L62 43 L84 70" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="60" cy="60" r="42" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
      </svg>

      <div class="brand-copy">
        <span class="brand-name">HDM</span>
        <span class="brand-subtitle">Sistema</span>
      </div>
    </div>

    <div class="card">
      <div id="loginBox">
        <h1>Entrar</h1>
        <form id="loginForm">
          <div>
            <label for="user">Usuário</label>
            <input type="text" id="user" name="user" autocomplete="username" required />
          </div>

          <div>
            <label for="pass">Senha</label>
            <input type="password" id="pass" name="pass" autocomplete="current-password" required />
          </div>

          <button type="submit" class="primary-btn">Entrar</button>
          <button type="button" class="secondary-btn" id="btnNovoCadastro">Novo cadastro</button>
        </form>
      </div>

      <div id="cadastroBox" class="hidden">
        <h1>Novo cadastro</h1>
        <form id="cadastroForm">
          <div>
            <label for="novoNome">Nome</label>
            <input type="text" id="novoNome" name="novoNome" required />
          </div>

          <div>
            <label for="novoUsuario">Usuário</label>
            <input type="text" id="novoUsuario" name="novoUsuario" required />
          </div>

          <div>
            <label for="novaSenha">Senha</label>
            <input type="password" id="novaSenha" name="novaSenha" required />
          </div>

          <button type="submit" class="primary-btn">Cadastrar</button>
          <button type="button" class="secondary-btn" id="btnVoltarLogin">Voltar</button>
        </form>
      </div>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script>
    const loginBox = document.getElementById('loginBox');
    const cadastroBox = document.getElementById('cadastroBox');
    const btnNovoCadastro = document.getElementById('btnNovoCadastro');
    const btnVoltarLogin = document.getElementById('btnVoltarLogin');
    const msg = document.getElementById('msg');

    function showMessage(text, type) {
      msg.textContent = text;
      msg.classList.remove('success', 'warning');
      if (type) msg.classList.add(type);
    }

    btnNovoCadastro.addEventListener('click', function () {
      loginBox.classList.add('hidden');
      cadastroBox.classList.remove('hidden');
      showMessage('', '');
    });

    btnVoltarLogin.addEventListener('click', function () {
      cadastroBox.classList.add('hidden');
      loginBox.classList.remove('hidden');
      showMessage('', '');
    });

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const user = document.getElementById('user').value.trim();

      if (user) {
        showMessage('Formulário enviado com sucesso (exemplo estático).', 'success');
      } else {
        showMessage('Preencha usuário e senha.', 'warning');
      }
    });

    document.getElementById('cadastroForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const nome = document.getElementById('novoNome').value.trim();
      const usuario = document.getElementById('novoUsuario').value.trim();

      if (nome && usuario) {
        showMessage('Cadastro concluído com sucesso (exemplo estático).', 'success');
      } else {
        showMessage('Preencha todos os campos.', 'warning');
      }
    });
  </script>
</body>
</html>
